<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>雙十親子遊｜Google Maps 路線</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:22px;background:#f4f7f6;color:#17352e}h1{font-size:26px}section{background:white;padding:20px;border-radius:16px;margin:16px 0}label{display:block;margin:12px 0}input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;font:inherit}button,a{display:inline-block;background:#146b55;color:white;padding:12px 16px;border-radius:9px;text-decoration:none;margin:6px 0;border:0;font:inherit}#routes a{display:block;line-height:1.6}p,small{line-height:1.6}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #e0a728;outline-offset:3px}</style><h1>🌲 雙十親子遊</h1><p>2026/10/10–11 · Google Maps 路線</p><section><label>第一天出發地<input id="origin" value="臺北市萬華區萬大國民小學"></label><label>回程目的地<input id="home" value="臺北市萬華區萬大國民小學"></label><button id="apply" type="button">套用出發與回程設定</button><p id="status" role="status"></p></section><section><h2>Google Maps 路線</h2><div id="routes"></div><p>開車與園區步行路線分開。點選路線後，在 Google Maps 確認行程。</p><a href="https://maps.app.goo.gl/ycqx2TyJajwJi4mG8">開啟原始 Google Maps 景點清單</a></section><script>
const routes=[["第一天開車：萬大國小 → 東眼山餐廳停車場 → 泉頭 → 基拉耳", "https://www.google.com/maps/dir/?api=1&destination=24.8052836%2C121.3474821&travelmode=driving&origin=%E8%87%BA%E5%8C%97%E5%B8%82%E8%90%AC%E8%8F%AF%E5%8D%80%E8%90%AC%E5%A4%A7%E5%9C%8B%E6%B0%91%E5%B0%8F%E5%AD%B8&waypoints=24.8282211%2C121.40986459999999%7C24.797705%2C121.360962"], ["第二天開車：基拉耳 → 小烏來停車場 → 山月茶屋 → 萬大國小", "https://www.google.com/maps/dir/?api=1&destination=%E8%87%BA%E5%8C%97%E5%B8%82%E8%90%AC%E8%8F%AF%E5%8D%80%E8%90%AC%E5%A4%A7%E5%9C%8B%E6%B0%91%E5%B0%8F%E5%AD%B8&travelmode=driving&origin=24.8052836%2C121.3474821&waypoints=24.7910808%2C121.3781514%7C24.8197542%2C121.3399656"], ["小烏來步行：停車場 → 天空步道 → 停車場", "https://www.google.com/maps/dir/?api=1&destination=24.7910808%2C121.3781514&travelmode=walking&origin=24.7910808%2C121.3781514&waypoints=24.790326399999998%2C121.3754843"]];
function render(){const origin=document.getElementById('origin').value.trim(),home=document.getElementById('home').value.trim(),status=document.getElementById('status');if(!origin||!home){status.textContent='請填寫出發地與回程目的地';return}const list=document.getElementById('routes');list.replaceChildren();routes.forEach(([label,url],i)=>{const u=new URL(url);if(i===0){u.searchParams.set('origin',origin);label='第一天：'+origin+' → 東眼山餐廳停車場 → 泉頭 → 基拉耳山莊'}if(i===1){u.searchParams.set('destination',home);label='第二天：基拉耳山莊 → 小烏來停車場 → 山月茶屋 → '+home}const a=document.createElement('a');a.textContent=label;a.href=u.href;list.append(a)});try{localStorage.setItem('trip-2026-settings',JSON.stringify({origin,home}))}catch{}status.textContent='已套用：出發 '+origin+'；回程 '+home}
document.getElementById('apply').addEventListener('click',render);for(const id of ['origin','home'])document.getElementById(id).addEventListener('input',()=>{document.getElementById('status').textContent='修改後請按「套用出發與回程設定」'});try{const saved=JSON.parse(localStorage.getItem('trip-2026-settings'));if(saved?.origin&&saved?.home){document.getElementById('origin').value=saved.origin;document.getElementById('home').value=saved.home}}catch{}render();
</script></html>
